[package]
name = "mahoraga-js"
description = "WebAssembly bindings for the mahoraga expression language"
license = "MIT"
repository = "https://github.com/dog4ik/mahoraga-js"
homepage = "https://github.com/dog4ik/mahoraga-js#readme"
keywords = ["expression", "templates", "wasm", "webassembly"]
version = "0.2.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
mahoraga = { path = "../mahoraga" }
wasm-bindgen = "0.2.129"
js-sys = "0.3.106"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
