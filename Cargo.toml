[package]
name = "mahoraga-js"
description = "WebAssembly bindings for the mahoraga expression language"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dog4ik/mahoraga-js"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Path dependency until the latest mahoraga (error spans/help) is pushed or published.
mahoraga = { path = "../mahoraga" }
wasm-bindgen = "0.2.129"
js-sys = "0.3.106"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
